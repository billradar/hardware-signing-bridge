name: CD

on:
  push:
    branches:
      - "phase1/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.os }} / ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            arch: x64
            runner: windows-2025
            runner_arch: X64
          - os: windows
            arch: arm64
            runner: windows-11-arm
            runner_arch: ARM64
          - os: macos
            arch: x64
            runner: macos-15-intel
            runner_arch: X64
          - os: macos
            arch: arm64
            runner: macos-15
            runner_arch: ARM64
          - os: linux
            arch: x64
            runner: ubuntu-24.04
            runner_arch: X64
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
            runner_arch: ARM64

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify runner architecture
        shell: bash
        run: |
          set -euo pipefail
          echo "Runner OS: ${RUNNER_OS}"
          echo "Runner architecture: ${RUNNER_ARCH}"
          test "${RUNNER_ARCH}" = "${{ matrix.runner_arch }}"

      - name: Build and test
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Stage portable Java artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp bridge-api/target/*.jar dist/
          cp bridge-jca/target/*.jar dist/
          cp adapter-yubikey-piv/target/*.jar dist/
          cp README.md SECURITY.md dist/

          cat > dist/BUILD-METADATA.txt <<EOF
          Project: Hardware Signing Bridge
          Java: 21
          Build type: portable Java JARs
          Runner OS: ${RUNNER_OS}
          Runner architecture: ${RUNNER_ARCH}
          Git commit: ${GITHUB_SHA}
          Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          Note: These JARs are platform-independent; the OS/architecture identifies the native runner on which the build and tests ran.
          EOF

          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum *.jar > SHA256SUMS
          else
            shasum -a 256 *.jar > SHA256SUMS
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hardware-signing-bridge-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
